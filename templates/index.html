<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection & Explainability System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .upload-section { border: 2px dashed #3498db; padding: 30px; text-align: center; border-radius: 8px; background: #ebf5fb; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 10px 20px; color: white; background-color: #3498db; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .custom-file-upload:hover { background-color: #2980b9; }
        button { margin-top: 15px; padding: 10px 25px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .results-section { display: flex; justify-content: space-around; margin-top: 30px; flex-wrap: wrap; }
        .image-card { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; text-align: center; width: 45%; min-width: 300px; }
       .image-card img { width: 100%; height: 320px; object-fit: contain; border-radius: 5px; margin-top: 10px; }
        .prediction-badge { font-size: 20px; font-weight: bold; padding: 10px; margin-top: 20px; border-radius: 6px; text-align: center; }
        .PNEUMONIA { background-color: #fadbd8; color: #78281f; border: 1px solid #f5b7b1; }
        .NORMAL { background-color: #d4efdf; color: #145a32; border: 1px solid #a9dfbf; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hybrid Pneumonia Diagnostic Dashboard</h1>
        <p class="subtitle">DenseNet-121 + Vision Transformer Self-Attention + CLAHE Preprocessing + Grad-CAM Explainability</p>

        <form action="/predict" method="post" enctype="multipart/form-data" class="upload-section">
            <label for="file-upload" class="custom-file-upload">Choose Chest X-Ray File</label>
            <input id="file-upload" type="file" name="file" accept="image/*" required onchange="updateFileName()">
            <span id="file-name" style="margin-left: 10px; color: #555;">No file chosen</span>
            <br>
            <button type="submit">Analyze Scan</button>
        </form>

        {% if prediction %}
            <div class="prediction-badge {{ prediction }}">
                Diagnostic Result: {{ prediction }}
            </div>

            <div class="results-section">
                <div class="image-card">
                    <h3>Enhanced Input X-Ray (CLAHE)</h3>
                    <img src="{{ url_for('static', filename='uploads/' + original_img) }}" alt="Original Image">
                </div>
                <div class="image-card">
                    <h3>Grad-CAM Attention Heatmap</h3>
                    <img src="{{ url_for('static', filename='uploads/' + heatmap_img) }}" alt="Grad-CAM Heatmap">
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        function updateFileName() {
            var input = document.getElementById('file-upload');
            var fileName = document.getElementById('file-name');
            fileName.textContent = input.files[0] ? input.files[0].name : "No file chosen";
        }
    </script>
</body>
</html>
