<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinical Portal - Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; max-width: 440px; margin: 50px auto; }
        .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #ffffff; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #ffffff; border-color: #0284c7; box-shadow: none; }
        .input-group-text { background-color: #0f172a; border-color: #334155; color: #94a3b8; cursor: pointer; }
        .nav-pills .nav-link { color: #94a3b8; border-radius: 4px; }
        .nav-pills .nav-link.active { background-color: #0284c7; color: #ffffff; }
        .btn-oauth { border: 1px solid #334155; color: #cbd5e1; background: #0f172a; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; padding: 8px; border-radius: 4px; font-weight: 600; }
        .btn-oauth:hover { background: #1e293b; color: #ffffff; }
    </style>
</head>
<body>

<div class="container">
    <div class="card auth-card p-4 shadow">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-white mb-1">General Diagnostic Center</h4>
            <span class="text-secondary small">Clinical Diagnostic Imaging System</span>
        </div>

        {% if error %}
            <div class="alert alert-danger p-2 small mb-3">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success p-2 small mb-3">{{ success }}</div>
        {% endif %}

        <ul class="nav nav-pills nav-justified mb-4" id="authTabs">
            <li class="nav-item">
                <button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#login-tab">Sign In</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#register-tab">New Patient</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- SIGN IN TAB -->
            <div class="tab-pane fade show active" id="login-tab">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Institutional or personal email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password" required>
                            <span class="input-group-text" onclick="togglePassword('loginPassword', 'loginEye')">
                                <i class="bi bi-eye" id="loginEye"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3" style="background-color: #0284c7; border: none;">Sign In</button>
                </form>

                <div class="position-relative text-center my-3">
                    <hr class="border-secondary">
                    <span class="position-absolute top-50 start-50 translate-middle px-2 text-muted small" style="background-color: #1e293b;">OR</span>
                </div>

                <div class="d-grid gap-2 mb-2">
                    <a href="/oauth_placeholder/google" class="btn-oauth">
                        <i class="bi bi-google text-danger fs-6"></i> Sign in with Google
                    </a>
                    <a href="/oauth_placeholder/facebook" class="btn-oauth">
                        <i class="bi bi-facebook text-primary fs-6"></i> Sign in with Facebook
                    </a>
                </div>
            </div>

            <!-- REGISTER TAB -->
            <div class="tab-pane fade" id="register-tab">
                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="patient@mail.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Account Registration Type</label>
                        <select name="patient_type" id="patientTypeSelect" class="form-select" onchange="toggleDoctorField()">
                            <option value="PUBLIC">Public Patient (Self Evaluation)</option>
                            <option value="PRIVATE_HOSPITAL">Private Hospital Patient (Attending Physician Linked)</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="doctorSelectGroup">
                        <label class="form-label text-secondary small fw-bold">Attending Physician</label>
                        <select name="attending_doctor" class="form-select">
                            <option value="Unassigned">-- Select Attending Doctor --</option>
                            {% for doc in doctors %}
                                <option value="{{ doc['name'] }}">{{ doc['name'] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">Create Password</label>
                        <div class="input-group">
                            <input type="password" id="regPassword" name="password" class="form-control" placeholder="Password" required>
                            <span class="input-group-text" onclick="togglePassword('regPassword', 'regEye')">
                                <i class="bi bi-eye" id="regEye"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2" style="background-color: #059669; border: none;">Create Patient Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, eyeId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(eyeId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        }
    }

    function toggleDoctorField() {
        const patientType = document.getElementById('patientTypeSelect').value;
        const doctorGroup = document.getElementById('doctorSelectGroup');
        if (patientType === 'PRIVATE_HOSPITAL') {
            doctorGroup.classList.remove('d-none');
        } else {
            doctorGroup.classList.add('d-none');
        }
    }
</script>
</body>
</html>
